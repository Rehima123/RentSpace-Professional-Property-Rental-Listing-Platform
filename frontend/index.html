<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta -->
    <title>RentSpace — Find Your Perfect Space in Ethiopia</title>
    <meta name="description" content="Ethiopia's trusted property rental platform. Find apartments, houses, studios, condominiums and commercial spaces across Addis Ababa, Bahir Dar, Hawassa, Adama and more — in Ethiopian Birr." />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#1e3a8a" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type"        content="website" />
    <meta property="og:title"       content="RentSpace — Find Your Perfect Space in Ethiopia" />
    <meta property="og:description" content="Browse verified rental properties across Ethiopia. Apartments, houses, studios and commercial spaces in ETB." />
    <meta property="og:url"         content="https://rentspace.et" />

    <!-- Twitter Card -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="RentSpace — Find Your Perfect Space in Ethiopia" />
    <meta name="twitter:description" content="Browse verified rental properties across Ethiopia in Ethiopian Birr." />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Preconnect for Google Fonts (loaded in CSS) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
